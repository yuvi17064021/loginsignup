<!DOCTYPE html>
<html lang="en">
<head>
  <title>Quant Interview Prep</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href='https://googleapis.com' rel='stylesheet' type='text/css'>
  <link href='https://cloudflare.com' rel='stylesheet' type='text/css'>
  <link rel="stylesheet" type="text/css" href="test.css">
</head>
<body>

  <!-- NAVBAR, SIDENAV, TIMER & HEADER (Assume existing structure from previous context) -->
  <div class="navbar">...</div>
  <div id="mySidenav" class="sidenav">...</div>
  <div id="headerSection" class="tyui" style="margin-top: 80px;">...</div>

  <!-- MAIN CONTENT AREA -->
  <div id="asdf">
    <div class="main1">
      <h2 id="questionTitle">Question 1</h2>
      <p id="questionText">Loading question...</p>
      <form id="optionsForm"></form>
    </div>
    <div class="share">
      <div id="first" style="display:none;"><a href="#" onclick="prevQuestion()">Previous</a></div>
      <div id="middle"><a href="#" onclick="nextQuestion()">Next</a></div>
      <div id="last" style="display:none;" onclick="showSubmissionScreen()"><a href="#">Finish</a></div>
    </div>
  </div>

  <!-- SUBMISSION SCREEN -->
  <div id="qwer" style="display:none;">
    <div class="main">
      <h2>Final Submission</h2>
      <p>Review your answers carefully. Once submitted, you will see your score and correct answers.</p>
      <div class="share">
        <div onclick="backToQuestions()"><a href="#">Go Back</a></div>
        <div><a href="#" onclick="processResults()" style="background: #28a745; color: white; border: none;">Submit Exam</a></div>
      </div>
    </div>
  </div>

  <!-- RESULTS SUMMARY SCREEN -->
  <div id="resultsScreen" style="display:none;">
    <div class="main">
      <h2 id="finalScoreText">Your Results</h2>
      <div id="resultsList" style="max-height: 400px; overflow-y: auto; text-align: left; padding: 10px;"></div>
      <div class="share">
        <a href="index.html" style="background: #1dc8cd; color: white;">Restart Test</a>
      </div>
    </div>
  </div>

  <script>
    // ... (questions array containing 20 questions) ...
    const questions = [ /* ... */ ];

    let currentIdx = 0;
    // 1. Initialize userAnswers array to store responses
    let userAnswers = new Array(questions.length).fill(null); 

    function renderQuestion(index) {
      currentIdx = index;
      const question = questions[index];
      document.getElementById("questionTitle").innerText = `Question ${index + 1}`;
      document.getElementById("questionText").innerText = question.q;
      
      let html = "";
      question.options.forEach(opt => {
        const isChecked = userAnswers[index] === opt ? "checked" : "";
        html += `<div style="margin-bottom:10px;"><input type="radio" name="opt" value="${opt}" ${isChecked} onclick="saveAnswer('${opt}')"> <span class="options">${opt}</span></div>`;
      });
      document.getElementById("optionsForm").innerHTML = html;
      // ... navigation logic ...
    }

    // 2. Function to save user's choice
    function saveAnswer(val) { userAnswers[currentIdx] = val; }
    // ... prevQuestion, nextQuestion, showSubmissionScreen ...

    // 3. Updated processResults function to calculate score and display feedback
    function processResults() {
      let score = 0;
      let resultsHtml = "";
      
      questions.forEach((q, i) => {
        const isCorrect = userAnswers[i] === q.correct;
        if (isCorrect) score++;
        
        resultsHtml += `<div style="margin-bottom:15px; padding:10px; border-left: 5px solid ${isCorrect ? '#28a745' : '#d9534f'}; background:#f8f9fa;">
          <strong>Q${i+1}: ${q.q}</strong><br>
          Your Answer: <span style="color:${isCorrect ? '#28a745' : '#d9534f'}">${userAnswers[i] || 'Skipped'}</span><br>
          ${!isCorrect ? `Correct Answer: <span style="color:#28a745">${q.correct}</span>` : ''}
        </div>`;
      });

      document.getElementById("qwer").style.display = 'none';
      document.getElementById("headerSection").style.display = 'none';
      document.getElementById("resultsScreen").style.display = 'block';
      document.getElementById("finalScoreText").innerText = `Score: ${score} / ${questions.length}`;
      document.getElementById("resultsList").innerHTML = resultsHtml;
    }

    // ... Initialize first question ...
    renderQuestion(0);
    // ... Timer functionality ...
  </script>
</body>
</html>
