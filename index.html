<!DOCTYPE html>
<html lang="en">
<head>
  <title>Quant Interview Prep</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href='https://googleapis.com' rel='stylesheet' type='text/css'>
  <link href='https://cloudflare.com' rel='stylesheet' type='text/css'>
  <link rel="stylesheet" type="text/css" href="test.css">
</head>
<body>

  <!-- NAVBAR -->
  <div class="navbar">
    <div style="display:inline-flex; align-items: center;">
      <!-- Quant SVG Logo -->
      <svg width="40" height="40" viewBox="0 0 100 100" style="margin-left:10px;">
        <circle cx="50" cy="50" r="45" fill="none" stroke="white" stroke-width="5"/>
        <path d="M30 70 L50 30 L70 70 M40 55 L60 55" stroke="white" stroke-width="5" fill="none"/>
      </svg>
      <span style="font-size:1.8rem; color:white; margin-left: 10px; font-weight: 500;">QUANT</span>
    </div>
    <span class="sgn" style="float:right; margin-right:20px; line-height: 40px;">
      <a href="#" style="color:white; text-decoration:none;">Sign Out</a>
    </span>
  </div>

  <!-- SIDENAV -->
  <div id="mySidenav" class="sidenav">
    <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>
    <ul id="questionList" style="list-style:none; padding: 0;">
      <!-- JS will populate questions 1-20 here -->
    </ul>
  </div>

  <!-- TIMER & HEADER -->
  <div class="tyui" style="margin-top: 80px;">
    <div class="a" style="background: white; padding: 15px; overflow: auto; border-radius: 8px; margin: 0 20px;">
      <span style="font-size:1.5rem; cursor:pointer;" onclick="openNav()">☰ Question List</span>
      <div id="demo" style="float:right; font-size:1.5rem; color:#d9534f; font-weight:bold;"></div>
    </div>
  </div>

  <!-- MAIN CONTENT AREA -->
  <div id="asdf">
    <div class="main1">
      <h2 id="questionTitle">Question 1</h2>
      <p id="questionText">Loading question...</p>
      <form id="optionsForm">
        <!-- Options will be injected here -->
      </form>
    </div>
  </div>

  <!-- SUBMISSION SCREEN -->
  <div id="qwer" style="display:none;">
    <div class="main">
      <h2>Final Submission. Review your answers carefully.</h2>
      <div class="share">
        <div onclick="myFunction4()"><a href="#">Go Back</a></div>
        <div><a href="#" style="background: #28a745; color: white; border: none;">Submit Exam</a></div>
      </div>
    </div>
  </div>

  <!-- NAVIGATION -->
  <div class="share">
    <div id="first" style="display:none;"><a href="#" onclick="prevQuestion()">Previous</a></div>
    <div id="middle"><a href="#" onclick="nextQuestion()">Next</a></div>
    <div id="last" style="display:none;" onclick="myFunction3()"><a href="#">Finish</a></div>
  </div>

  <script>
    const questions = [
      { q: "What is the expected number of rolls of a fair 6-sided die to get a 6?", options: ["3", "6", "12", "36"] },
      { q: "You have 100 coins, one is biased (heads 60%). You pick one and flip it 10 times, getting 10 heads. What is the probability it's the biased coin?", options: ["~10%", "~50%", "~90%", "~99%"] },
      { q: "What is the square root of 0.1?", options: ["0.01", "0.316", "0.1", "1.0"] },
      { q: "If it takes 5 machines 5 minutes to make 5 widgets, how long does it take 100 machines to make 100 widgets?", options: ["1 minute", "5 minutes", "100 minutes", "500 minutes"] },
      { q: "Expected value of a sum of two dice rolls?", options: ["6", "7", "8", "12"] },
      { q: "Derivative of log(x)?", options: ["1/x", "x", "e^x", "log(e)"] },
      { q: "Probability of getting exactly 2 heads in 3 coin flips?", options: ["1/4", "1/2", "3/8", "1/8"] },
      { q: "If a call option is deep in-the-money, its delta is closest to?", options: ["0", "0.5", "1.0", "-1.0"] },
      { q: "In a world series, what are the odds it goes to 7 games if each team has an equal chance?", options: ["1/4", "5/16", "1/2", "3/16"] },
      { q: "What is the sum of integers from 1 to 100?", options: ["5000", "5050", "5100", "4950"] },
      { q: "Black-Scholes assumes returns follow which distribution?", options: ["Normal", "Log-normal", "Uniform", "Poisson"] },
      { q: "If you double the volatility of an option, the Vega...", options: ["Doubles", "Halves", "Remains constant", "Depends on maturity"] },
      { q: "Value at Risk (VaR) measures?", options: ["Max possible loss", "Expected loss", "Minimum loss at confidence level", "Average loss"] },
      { q: "Correlation between two independent variables is?", options: ["1", "-1", "0", "0.5"] },
      { q: "Number of ways to arrange the letters in 'QUANT'?", options: ["24", "60", "120", "720"] },
      { q: "Standard deviation of a uniform distribution (0,1)?", options: ["1/12", "1/sqrt(12)", "1/2", "1/4"] },
      { q: "A stock price follows a Random Walk. What is the expected price in 1 year if drift is 0?", options: ["0", "Current Price", "Infinity", "Undefined"] },
      { q: "Put-Call Parity: C - P = ?", options: ["S - K", "S - K*e^(-rt)", "K - S", "S + K"] },
      { q: "What is 11 squared?", options: ["111", "121", "131", "141"] },
      { q: "Which 'Greek' measures sensitivity to time decay?", options: ["Delta", "Gamma", "Vega", "Theta"] }
    ];

    let currentIdx = 0;

    function renderQuestion(index) {
      currentIdx = index;
      const question = questions[index];
      document.getElementById("questionTitle").innerText = `Question ${index + 1}`;
      document.getElementById("questionText").innerText = question.q;
      
      let html = "";
      question.options.forEach(opt => {
        html += `<div style="margin-bottom:10px;"><input type="radio" name="opt" value="${opt}"> <span class="options">${opt}</span></div>`;
      });
      document.getElementById("optionsForm").innerHTML = html;

      // Update Nav Buttons
      document.getElementById("first").style.display = index === 0 ? 'none' : 'inline-block';
      document.getElementById("middle").style.display = index === questions.length - 1 ? 'none' : 'inline-block';
      document.getElementById("last").style.display = index === questions.length - 1 ? 'inline-block' : 'none';
    }

    function nextQuestion() { if(currentIdx < questions.length - 1) renderQuestion(currentIdx + 1); }
    function prevQuestion() { if(currentIdx > 0) renderQuestion(currentIdx - 1); }

    function openNav() { document.getElementById("mySidenav").style.width = "250px"; }
    function closeNav() { document.getElementById("mySidenav").style.width = "0"; }

    function myFunction3() {
      document.getElementById("asdf").style.display = 'none';
      document.getElementById("qwer").style.display = 'block';
      document.getElementById("first").style.display = 'none';
      document.getElementById("middle").style.display = 'none';
      document.getElementById("last").style.display = 'none';
    }

    function myFunction4() {
      document.getElementById("asdf").style.display = 'block';
      document.getElementById("qwer").style.display = 'none';
      renderQuestion(questions.length - 1);
    }

    // Initialize sidebar
    const list = document.getElementById("questionList");
    questions.forEach((_, i) => {
      let li = document.createElement("li");
      li.innerHTML = `<a href="#" onclick="renderQuestion(${i}); closeNav();">Question ${i + 1}</a>`;
      list.appendChild(li);
    });

    // Start Question 1
    renderQuestion(0);

    // Timer
    var countDownDate = new Date().getTime() + 1000 * 60 * 30;
    var x = setInterval(function() {
      var now = new Date().getTime();
      var distance = countDownDate - now;
      var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      var seconds = Math.floor((distance % (1000 * 60)) / 1000);
      document.getElementById("demo").innerHTML = minutes + "m " + seconds + "s ";
      if (distance < 0) { clearInterval(x); document.getElementById("demo").innerHTML = "EXPIRED"; }
    }, 1000);
  </script>
</body>
</html>
