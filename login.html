<script>
function abcFunction1(id) {
  id = parseInt(id);
  if(id === 1) {
    document.getElementById("first").style.display = 'none';
    document.getElementById("middle").style.display = 'inline';
    document.getElementById("last").style.display = 'none';
  } else if(id === 20) {
    document.getElementById("first").style.display = 'inline';
    document.getElementById("middle").style.display = 'none';
    document.getElementById("last").style.display = 'inline';
  } else {
    document.getElementById("first").style.display = 'inline';
    document.getElementById("middle").style.display = 'inline';
    document.getElementById("last").style.display = 'none';
  }
}

function openNav() { document.getElementById("mySidenav").style.width = "250px"; }
function closeNav() { document.getElementById("mySidenav").style.width = "0"; }

// Fixed Timer Script
var countDownDate = new Date().getTime() + 1000 * 30 * 60;
var x = setInterval(function() {
    var now = new Date().getTime();
    var distance = countDownDate - now;
    var hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
    var seconds = Math.floor((distance % (1000 * 60)) / 1000);

    document.getElementById("demo").innerHTML = hours + "h " + minutes + "m " + seconds + "s"; // Fixed string

    if (distance < 0) {
        clearInterval(x);
        document.getElementById("demo").innerHTML = "EXPIRED";
    }
}, 1000); // Fixed: Added closing bracket for interval
</script>
